name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/DriveMeCrazy.App -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$version -o publish
          $hash = (Get-FileHash publish/DriveMeCrazy.exe -Algorithm SHA256).Hash
          "$hash  DriveMeCrazy.exe" | Out-File publish/DriveMeCrazy.exe.sha256 -Encoding ascii
          ./scripts/release-notes.ps1 -Version $version -Sha256 $hash -OutFile release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DriveMeCrazy ${{ github.ref_name }}
          files: |
            publish/DriveMeCrazy.exe
            publish/DriveMeCrazy.exe.sha256
          body_path: release-notes.md
